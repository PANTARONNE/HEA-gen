hydra:
  run:
    # finetune_hea_multi_gpu.sh exports OUTPUT_DIR so that weight injection and
    # training share one run dir. The fallback keeps the same layout for a bare
    # `mattergen-train --config-name=hea_finetune`, but note that such a run gets
    # a fresh empty dir and therefore NO warm start - use the script instead.
    dir: ${oc.env:OUTPUT_DIR,outputs/hea_finetune_run/${now:%Y-%m-%d}/${now:%H-%M-%S}}

auto_resume: true

defaults:
  - data_module: hea
  - trainer: hea
  - lightning_module: default
  - lightning_module/diffusion_module: atom_only
  - lightning_module/diffusion_module/model: mattergen
  - lightning_module/diffusion_module/corruption: atom_only

lightning_module:
  optimizer_partial:
    lr: 5e-6

trainer:
  accumulate_grad_batches: 4

data_module:
  max_epochs: 400
  batch_size:
    train: ${eval:'(64 // ${trainer.accumulate_grad_batches}) // (${trainer.devices} * ${trainer.num_nodes})'}
    val: ${eval:'(64 // ${trainer.accumulate_grad_batches}) // (${trainer.devices} * ${trainer.num_nodes})'}
